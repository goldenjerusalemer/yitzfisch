# Any JPG/PNG pushed into /img is converted to a web-ready WebP automatically:
# longest edge 2000px, quality 82, metadata stripped, sRGB. The original
# JPG/PNG is removed from the repo so only the WebP stays. Oversized WebPs
# pushed directly are shrunk the same way.
name: Optimize images

on:
  push:
    branches: [main]
    paths: ["img/**"]

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert to WebP
        run: |
          set -e
          shopt -s nullglob nocaseglob
          changed=0
          for f in img/*.jpg img/*.jpeg img/*.png img/*.tif img/*.tiff; do
            out="img/$(basename "${f%.*}").webp"
            echo "converting $f -> $out"
            convert "$f[0]" -auto-orient -resize '2000x2000>' -strip -colorspace sRGB \
                    -quality 82 -define webp:method=6 "$out"
            git rm -q "$f"
            changed=1
          done
          for f in img/*.webp; do
            read w h < <(identify -format "%w %h" "$f")
            if [ "$w" -gt 2000 ] || [ "$h" -gt 2000 ]; then
              echo "shrinking $f (${w}x${h})"
              mogrify -resize '2000x2000>' -strip -quality 82 -define webp:method=6 "$f"
              changed=1
            fi
          done
          echo "changed=$changed" >> "$GITHUB_ENV"

      - name: Commit optimized images
        if: env.changed == '1'
        run: |
          git config user.name  "image-optimizer"
          git config user.email "actions@users.noreply.github.com"
          git add -A img
          git commit -m "Convert images to web-ready WebP [skip ci]"
          git push
