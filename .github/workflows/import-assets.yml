name: Import gen-8 assets
on:
  push:
    branches: [new-gallery]
    paths: ['.github/workflows/import-assets.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-gallery
      - name: Download, verify, extract
        run: |
          set -e
          curl -fsSL 'https://drive.usercontent.google.com/download?id=1ZhxKmKi4EgGjeOgXI96yS3wwgelkm0xD&export=download&confirm=t' -o /tmp/assets.zip
          echo '699ac98225d45c77938ac1c32d9f6033f5fb1ff05ef0e11e29aa60f05cd8b5a3  /tmp/assets.zip' | sha256sum -c -
          mkdir -p /tmp/assets && unzip -oq /tmp/assets.zip -d /tmp/assets
          cp /tmp/assets/site.css ./site.css
          cp /tmp/assets/img/* ./img/
      - name: Commit assets
        run: |
          git config user.name "asset-importer"
          git config user.email "actions@users.noreply.github.com"
          git add site.css img
          if git diff --cached --quiet; then echo "already imported"; exit 0; fi
          git commit -m "Add site.css and gallery images (gen 8)"
          git push origin new-gallery
      - name: Remove this workflow
        run: |
          git config user.name "asset-importer"
          git config user.email "actions@users.noreply.github.com"
          [ -f .github/workflows/import-assets.yml ] || { echo "already removed"; exit 0; }
          git rm -q .github/workflows/import-assets.yml
          git commit -m "Remove asset import workflow"
          git push origin new-gallery
